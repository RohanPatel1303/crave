name: crave_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - packages/*

dev_dependencies:
  melos: ^7.0.0
  very_good_analysis: ^6.0.0

melos:
  scripts:
    analyze:
      description: Run static analysis for all workspace packages
      run: dart analyze --fatal-infos
      exec:
        concurrency: 4
    test:
      description: Run tests only in packages that contain a test directory.
      run: dart test
      exec:
        concurrency: 4
      packageFilters:
        dirExists:
          - test
