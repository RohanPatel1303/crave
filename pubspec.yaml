name: crave_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - packages/*
  - apps/*
  - tool

dev_dependencies:
  coverage: ^1.0.0
  melos: ^7.0.0
  very_good_analysis: ^6.0.0


melos:
  scripts:
    analyze:
      description: Run static analysis for all workspace packages
      run: dart analyze --fatal-infos && dart run melos run deps:check
      exec:
        concurrency: 4
    test:dart:
      description: Run tests only in packages that contain a test directory.
      run: dart run coverage:test_with_coverage
      exec:
        concurrency: 4
      packageFilters:
        flutter: false
        dirExists:
          - test
    test:flutter:
      description: Run tests only in packages that contain a test directory.
      run: flutter test --coverage
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists:
          - test
    test:
      steps:
        - test:dart
        - test:flutter
    coverage:gate:
      description: Enforce the workspace line coverage threshold
      run: dart run repo_tools:coverage_gate
    deps:check:
      description: Check workspace dependency layers
      run: dart run repo_tools:check_deps